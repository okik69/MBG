<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Bimbel Ceria</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#2d2a4a;--mut:#7a7699;--p:#ff7a59;--p2:#ffb400;--b:#4ecdc4;--g:#7bd88f;--r:#ff6b81;--line:#f0e6cc;--sh:0 6px 0 rgba(45,42,74,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);background-image:radial-gradient(circle at 10% 10%,#ffe9a8 0,transparent 25%),radial-gradient(circle at 90% 5%,#c9f3ef 0,transparent 25%)}
h1,h2,.brand{font-family:'Baloo 2','Nunito',system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:14px;padding:10px 18px;font-weight:800;cursor:pointer;background:var(--p);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.alt{background:var(--b)}.btn.gray{background:#e9e4d4;color:var(--ink)}.btn.red{background:var(--r)}.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:10px}
.hidden{display:none!important}
.box{background:var(--card);border-radius:24px;padding:26px;box-shadow:var(--sh);border:3px solid var(--line)}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
#auth .box{width:100%;max-width:400px}
#auth h1{font-size:2rem;text-align:center}
#auth p{text-align:center;color:var(--mut);margin:4px 0 18px}
label{display:block;font-weight:800;font-size:.85rem;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 14px;border:3px solid var(--line);border-radius:14px;background:#fffdf6;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--b)}
textarea{min-height:80px;resize:vertical}
.err{color:var(--r);font-weight:800;min-height:1.2em;margin-top:10px;text-align:center}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 22px}
.brand{font-size:1.6rem;color:var(--p)}
.who{display:flex;gap:10px;align-items:center;font-weight:800;flex-wrap:wrap}
.badge{font-size:.72rem;padding:3px 10px;border-radius:99px;background:#e6f9f7;color:#1b8f86;font-weight:800}
.badge.no{background:#ffe3e8;color:#d63a55}.badge.ok{background:#e3f8e8;color:#2c9a48}
main{max-width:1200px;margin:0 auto;padding:0 16px 40px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:3px solid var(--line);background:#fff;border-radius:99px;padding:8px 18px;font-weight:800;cursor:pointer}
.tab.on{background:var(--p2);border-color:var(--p2);color:#fff}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar input{max-width:280px}
.wrap{overflow-x:auto;border-radius:18px;border:3px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:640px;background:#fff}
th{background:#fff1c9;text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;padding:12px}
td{padding:11px 12px;border-top:2px solid var(--line);font-size:.92rem;vertical-align:top}
td.act{white-space:nowrap;display:flex;gap:6px}
.empty{text-align:center;color:var(--mut);padding:30px}
.ov{position:fixed;inset:0;background:rgba(45,42,74,.55);display:grid;place-items:center;padding:16px;z-index:10}
.ov .box{width:100%;max-width:480px;max-height:90vh;overflow:auto}
.ov .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-weight:800;z-index:20}
</style>
</head>
<body>

<div id="auth">
  <div class="box">
    <h1>🎒 Bimbel Ceria</h1>
    <p id="authSub">Masuk khusus Admin</p>
    <form id="authForm" autocomplete="off">
      <div id="setupOnly" class="hidden">
        <label>Email</label><input id="a_email" type="email">
        <label>No. WhatsApp</label><input id="a_hp" type="tel">
      </div>
      <label>Nama Lengkap / Username</label><input id="a_nama" required>
      <label>Password</label><input id="a_pass" type="password" required>
      <div class="err" id="authErr"></div>
      <button class="btn" style="width:100%;margin-top:8px" id="authBtn">Masuk</button>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">🎒 Bimbel Ceria · Admin</div>
    <div class="who"><span id="modeBadge" class="badge"></span><span id="meName"></span><button class="btn sm gray" id="logout">Keluar</button></div>
  </header>
  <main>
    <div class="tabs" id="tabs"></div>
    <div class="box">
      <div class="bar">
        <h2 id="tabTitle"></h2>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><input id="q" placeholder="🔍 Cari..."><button class="btn alt" id="addBtn">+ Tambah</button></div>
      </div>
      <div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </main>
</div>

<div id="modal" class="ov hidden"></div>
<div id="toast" class="hidden"></div>

<script>
const FB_URL = "https://nodemcu-91530-default-rtdb.firebaseio.com";
const ROOT = "bimbel_jadwal";
const HARI = ["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupiah = n => "Rp " + Number(n || 0).toLocaleString("id-ID");
const nowLocal = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString();

const SCHEMA = {
  users: { label: "Pengguna", icon: "🧑‍🎓", pk: "user_id", prefix: "U", fields: [
    { k: "nama", l: "Nama Lengkap", t: "text", req: 1 },
    { k: "email", l: "Email", t: "email", req: 1 },
    { k: "no_hp", l: "No. WhatsApp", t: "tel", req: 1 },
    { k: "role", l: "Role", t: "select", opts: () => [["siswa","Siswa"],["admin","Admin"]], req: 1 },
    { k: "tanggal_daftar", l: "Tanggal Daftar", t: "date", req: 1 },
    { k: "_pass", l: "Password", t: "password" }
  ]},
  paket: { label: "Paket Kelas", icon: "📦", pk: "paket_id", prefix: "P", fields: [
    { k: "nama_paket", l: "Nama Paket", t: "text", req: 1 },
    { k: "deskripsi", l: "Deskripsi", t: "textarea" },
    { k: "harga", l: "Harga (Rp)", t: "number", req: 1 },
    { k: "durasi_bulan", l: "Durasi (bulan)", t: "number", req: 1 },
    { k: "status_aktif", l: "Status", t: "select", opts: () => [["true","Aktif"],["false","Nonaktif"]], req: 1 }
  ]},
  jadwal: { label: "Jadwal Kelas", icon: "📅", pk: "jadwal_id", prefix: "J", fields: [
    { k: "paket_id", l: "Paket", t: "select", ref: "paket", req: 1 },
    { k: "mata_pelajaran", l: "Mata Pelajaran", t: "text", req: 1 },
    { k: "pengajar", l: "Pengajar", t: "text", req: 1 },
    { k: "hari", l: "Hari", t: "select", opts: () => HARI.map(h => [h, h]), req: 1 },
    { k: "jam_mulai", l: "Jam Mulai", t: "time", req: 1 },
    { k: "jam_selesai", l: "Jam Selesai", t: "time", req: 1 },
    { k: "tipe_kelas", l: "Tipe Kelas", t: "select", opts: () => [["online","Online"],["offline","Offline"]], req: 1 },
    { k: "lokasi_atau_link", l: "Lokasi / Link G-Meet", t: "text", req: 1 }
  ]},
  daftar: { label: "Pendaftaran", icon: "🧾", pk: "daftar_id", prefix: "D", fields: [
    { k: "user_id", l: "Siswa", t: "select", ref: "users", req: 1 },
    { k: "paket_id", l: "Paket", t: "select", ref: "paket", req: 1 },
    { k: "status_pembayaran", l: "Status Pembayaran", t: "select", opts: () => [["pending","Pending"],["lunas","Lunas"],["batal","Batal"]], req: 1 },
    { k: "tanggal_pembelian", l: "Tanggal Pembelian", t: "datetime-local", req: 1 }
  ]}
};
const REFLABEL = { users: "nama", paket: "nama_paket" };

let cache = { users: {}, paket: {}, jadwal: {}, daftar: {} };
let mode = "lokal", me = null, tab = "users";

/* ---------- Penyimpanan: Firebase REST, fallback localStorage ---------- */
const url = (col, id) => `${FB_URL}/${ROOT}/${col}${id ? "/" + id : ""}.json`;
async function storeInit() {
  try {
    const r = await fetch(url("users"), { signal: AbortSignal.timeout(6000) });
    if (!r.ok) throw 0;
    mode = "firebase";
  } catch (e) { mode = "lokal"; }
}
async function loadAll() {
  for (const col of Object.keys(cache)) {
    if (mode === "firebase") cache[col] = (await (await fetch(url(col))).json()) || {};
    else cache[col] = JSON.parse(localStorage.getItem(ROOT + col) || "{}");
  }
}
const persistLocal = col => localStorage.setItem(ROOT + col, JSON.stringify(cache[col]));
async function dbPut(col, id, obj) {
  if (mode === "firebase") {
    const r = await fetch(url(col, id), { method: "PUT", body: JSON.stringify(obj) });
    if (!r.ok) throw new Error("Gagal menyimpan ke Firebase");
    cache[col][id] = obj;
  } else { cache[col][id] = obj; persistLocal(col); }
}
async function dbDel(col, id) {
  if (mode === "firebase") {
    const r = await fetch(url(col, id), { method: "DELETE" });
    if (!r.ok) throw new Error("Gagal menghapus di Firebase");
    delete cache[col][id];
  } else { delete cache[col][id]; persistLocal(col); }
}

/* ---------- Util ---------- */
async function hash(s) {
  try {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch (e) { let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return "x" + h; }
}
const newId = p => p + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 4).toUpperCase();
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.remove("hidden"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), 2600); }
const refName = (col, id) => { const o = cache[col][id]; return o ? o[REFLABEL[col]] : "(terhapus)"; };
function options(f) {
  if (f.ref) return Object.values(cache[f.ref]).map(o => [o[SCHEMA[f.ref].pk], o[REFLABEL[f.ref]]]);
  return f.opts();
}

/* ---------- Auth ---------- */
async function initAuth() {
  await storeInit();
  await loadAll();
  const uid = sessionStorage.getItem("uid");
  if (uid && cache.users[uid] && cache.users[uid].role === "admin") { me = cache.users[uid]; return showApp(); }
  const first = Object.keys(cache.users).length === 0;
  $("setupOnly").classList.toggle("hidden", !first);
  $("authSub").textContent = first ? "Buat akun Admin pertama" : "Masuk khusus Admin";
  $("authBtn").textContent = first ? "Buat Admin & Masuk" : "Masuk";
  $("auth").classList.remove("hidden");
  $("authForm").dataset.first = first ? "1" : "";
}
$("authForm").onsubmit = async e => {
  e.preventDefault();
  const nama = $("a_nama").value.trim(), pass = $("a_pass").value, err = $("authErr");
  err.textContent = "";
  try {
    if (e.target.dataset.first) {
      const id = newId("U");
      const u = { user_id: id, nama, email: $("a_email").value.trim(), no_hp: $("a_hp").value.trim(), role: "admin", tanggal_daftar: nowLocal().slice(0, 10), pass: await hash(id + ":" + pass) };
      await dbPut("users", id, u); me = u;
    } else {
      const key = nama.toLowerCase();
      const u = Object.values(cache.users).find(x => x.nama.toLowerCase() === key || (x.email || "").toLowerCase() === key);
      if (!u || u.pass !== await hash(u.user_id + ":" + pass)) return err.textContent = "Nama atau password salah";
      if (u.role !== "admin") return err.textContent = "Halaman ini hanya untuk Admin";
      me = u;
    }
    sessionStorage.setItem("uid", me.user_id);
    showApp();
  } catch (x) { err.textContent = x.message; }
};
$("logout").onclick = () => { sessionStorage.removeItem("uid"); location.reload(); };

/* ---------- App ---------- */
function showApp() {
  $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
  $("meName").textContent = "👋 " + me.nama;
  const b = $("modeBadge"); b.textContent = mode === "firebase" ? "☁️ Firebase" : "💾 Lokal (browser)"; b.className = "badge " + (mode === "firebase" ? "ok" : "no");
  $("tabs").innerHTML = Object.entries(SCHEMA).map(([k, s]) => `<button class="tab" data-t="${k}">${s.icon} ${s.label}</button>`).join("");
  $("tabs").onclick = e => { const t = e.target.closest(".tab"); if (t) { tab = t.dataset.t; $("q").value = ""; render(); } };
  render();
}
function cell(f, v) {
  if (f.ref) return esc(refName(f.ref, v));
  if (f.k === "harga") return rupiah(v);
  if (f.k === "status_aktif") return v ? '<span class="badge ok">Aktif</span>' : '<span class="badge no">Nonaktif</span>';
  if (f.k === "status_pembayaran") return `<span class="badge ${v === "lunas" ? "ok" : v === "batal" ? "no" : ""}">${esc(v)}</span>`;
  if (f.k === "role") return `<span class="badge ${v === "admin" ? "" : "ok"}">${esc(v)}</span>`;
  if (f.t === "datetime-local") return esc(String(v || "").replace("T", " "));
  if (f.k === "deskripsi") return esc(String(v || "").slice(0, 60)) + (String(v || "").length > 60 ? "…" : "");
  return esc(v);
}
function render() {
  const s = SCHEMA[tab], cols = s.fields.filter(f => f.t !== "password");
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  $("tabTitle").textContent = s.icon + " " + s.label;
  $("thead").innerHTML = "<tr>" + cols.map(f => `<th>${f.l}</th>`).join("") + "<th>Aksi</th></tr>";
  const q = $("q").value.toLowerCase();
  const rows = Object.values(cache[tab]).filter(o => !q || cols.map(f => f.ref ? refName(f.ref, o[f.k]) : o[f.k]).join(" ").toLowerCase().includes(q));
  $("tbody").innerHTML = rows.length ? rows.map(o => `<tr>${cols.map(f => `<td>${cell(f, o[f.k])}</td>`).join("")}<td class="act"><button class="btn sm alt" data-e="${o[s.pk]}">Ubah</button><button class="btn sm red" data-d="${o[s.pk]}">Hapus</button></td></tr>`).join("") : `<tr><td class="empty" colspan="${cols.length + 1}">Belum ada data 🌈</td></tr>`;
}
$("q").oninput = render;
$("addBtn").onclick = () => openForm();
$("tbody").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.e) openForm(b.dataset.e); else if (b.dataset.d) remove(b.dataset.d);
};

/* ---------- Form Tambah / Ubah ---------- */
function openForm(id) {
  const s = SCHEMA[tab], o = id ? cache[tab][id] : null;
  const html = s.fields.map(f => {
    let v = o ? o[f.k] : "";
    if (!o) {
      if (f.k === "tanggal_daftar") v = nowLocal().slice(0, 10);
      if (f.k === "tanggal_pembelian") v = nowLocal().slice(0, 16);
    }
    if (f.k === "status_aktif") v = String(o ? o[f.k] : true);
    let inp;
    if (f.t === "select") {
      const ops = options(f);
      inp = `<select id="f_${f.k}">${ops.length ? "" : '<option value="">(isi data terkait dulu)</option>'}${ops.map(([a, b]) => `<option value="${esc(a)}" ${String(v) === String(a) ? "selected" : ""}>${esc(b)}</option>`).join("")}</select>`;
    } else if (f.t === "textarea") inp = `<textarea id="f_${f.k}">${esc(v)}</textarea>`;
    else inp = `<input id="f_${f.k}" type="${f.t}" value="${f.t === "password" ? "" : esc(v)}" ${f.t === "number" ? 'min="0"' : ""} ${f.t === "password" ? 'autocomplete="new-password" placeholder="' + (o ? "Kosongkan jika tidak diubah" : "Wajib diisi") + '"' : ""}>`;
    return `<label>${f.l}</label>${inp}`;
  }).join("");
  const m = $("modal");
  m.innerHTML = `<div class="box"><h2>${id ? "Ubah" : "Tambah"} ${s.label}</h2>${html}<div class="err" id="fErr"></div><div class="row"><button class="btn gray" id="cancel">Batal</button><button class="btn" id="save">Simpan</button></div></div>`;
  m.classList.remove("hidden");
  $("cancel").onclick = () => m.classList.add("hidden");
  $("save").onclick = () => save(id);
}
async function save(id) {
  const s = SCHEMA[tab], old = id ? cache[tab][id] : null, err = $("fErr");
  const obj = old ? { ...old } : { [s.pk]: newId(s.prefix) };
  for (const f of s.fields) {
    let v = $("f_" + f.k).value.trim();
    if (f.t === "password") continue;
    if (f.req && v === "") return err.textContent = `${f.l} wajib diisi`;
    if (f.t === "number") v = Number(v);
    if (f.k === "status_aktif") v = v === "true";
    obj[f.k] = v;
  }
  try {
    if (tab === "users") {
      const pw = $("f__pass").value;
      if (!old && !pw) return err.textContent = "Password wajib diisi";
      if (Object.values(cache.users).some(u => u.user_id !== obj.user_id && u.nama.toLowerCase() === obj.nama.toLowerCase())) return err.textContent = "Nama sudah dipakai";
      if (old && old.role === "admin" && obj.role !== "admin" && adminCount() <= 1) return err.textContent = "Minimal harus ada 1 admin";
      if (pw) obj.pass = await hash(obj.user_id + ":" + pw);
    }
    if (tab === "jadwal" && obj.jam_selesai <= obj.jam_mulai) return err.textContent = "Jam selesai harus setelah jam mulai";
    await dbPut(tab, obj[s.pk], obj);
    if (tab === "users" && obj.user_id === me.user_id) { me = obj; $("meName").textContent = "👋 " + me.nama; }
    $("modal").classList.add("hidden"); render(); toast("Tersimpan ✅");
  } catch (x) { err.textContent = x.message; }
}
const adminCount = () => Object.values(cache.users).filter(u => u.role === "admin").length;

/* ---------- Hapus ---------- */
async function remove(id) {
  const s = SCHEMA[tab], o = cache[tab][id];
  if (tab === "users") {
    if (id === me.user_id) return toast("Tidak bisa menghapus akun sendiri");
    if (o.role === "admin" && adminCount() <= 1) return toast("Minimal harus ada 1 admin");
    if (Object.values(cache.daftar).some(d => d.user_id === id)) return toast("Masih dipakai di Pendaftaran");
  }
  if (tab === "paket" && (Object.values(cache.jadwal).some(j => j.paket_id === id) || Object.values(cache.daftar).some(d => d.paket_id === id))) return toast("Paket masih dipakai di Jadwal/Pendaftaran");
  if (!confirm("Hapus data ini?")) return;
  try { await dbDel(tab, id); render(); toast("Terhapus 🗑️"); } catch (x) { toast(x.message); }
}

initAuth();
</script>
</body>
</html>
